# ==== Conexión a PostgreSQL ====
# Los datos de conexión NO van escritos aquí: se leen de variables de entorno.
#   - En tu computador: se definen en un archivo .env (no se sube a GitHub).
#   - En Render: se definen en el panel del servicio (Environment).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/studycards}

# ==== Hibernate ====
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# ==== CORS ====
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# ==== Puerto ====
# Render asigna el puerto en la variable PORT; en local se usa 8080.
quarkus.http.port=${PORT:8080}